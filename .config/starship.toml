format="""
$username$directory$git_branch$kubernetes$custom$cmd_duration$sudo$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$shell\
$character\
"""

[aws]
format = ' [$symbol($profile)(\($region\))($duration)]($style)'

[cmd_duration]
format = ' [⏱ $duration]($style)'

[gcloud]
format = ' [$symbol$account(@$domain)(\($region\))]($style)'

[git_branch]
format = ' [$symbol$branch]($style)'

[git_status]
format = ' ([$all_status$ahead_behind]($style))'

[kubernetes]
disabled = false
format = ' [$symbol$context(:$namespace)]($style) '
contexts = [
  { context_pattern = ".*-prod.*", style = "red" },
  { context_pattern = ".*-testing.*", style = "yellow" },
  { context_pattern = ".*-local.*", style = "green" },
]

[sudo]
format = ' [as $symbol]($style)'

[time]
format = '[$time]($style) '
disabled = false

[username]
format = '[$user]($style) '

[custom.npc]
when = true
shell = ["sh"]
# Preserve the ANSI colors emitted by the command.
unsafe_no_escape = true
format = '( $output )'
command = '''
config="$HOME/.config/newbius/config.yaml"
[ -r "$config" ] || exit 0
IFS= read -r profile < "$config" || [ -n "$profile" ] || exit 0
case "$profile" in
    *': '*) profile=${profile#*: } ;;
    *) exit 0 ;;
esac
[ -n "$profile" ] || exit 0
case "$profile" in
    *prod*)    color=31 ;;
    *testing|beta|gamma|omega*) color=33 ;;
    *local*)   color=32 ;;
    *) printf '󰢀 %s' "$profile"; exit 0 ;;
esac
printf '\033[%sm󰢀 %s\033[0m' "$color" "$profile"
'''
